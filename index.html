<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blastzone – Competitive Hub für Super Smash Bros. Ultimate</title>
    <meta
      name="description"
      content="Roster, Tier-Liste und Combo-Routen mit Input-Notation für die Fighter aus Super Smash Bros. Ultimate."
    />
    <meta name="theme-color" content="#06070a" />

    <!--
      Social-Vorschau. og.jpg wird von scripts/build-og-image.mjs aus den Assets
      im Repository gebaut – bei geänderten Zahlen dort neu erzeugen.
      Der Pfad ist bewusst relativ, weil es noch keine feste Domain gibt; sobald
      eine existiert, gehört hier die absolute URL hin (Crawler verlangen sie).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Blastzone" />
    <meta property="og:title" content="Blastzone – Competitive Hub für Super Smash Bros. Ultimate" />
    <meta
      property="og:description"
      content="86 Fighter-Profile mit 694 Combo-Routen, jede mit Quelle. Dazu die UltRank-Tier-Liste 2026 und Input-Notation."
    />
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Blastzone: 86 Profile, 694 Combo-Routen, 194 Kill-Confirms, daneben die Fighter der Ranglistenspitze."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blastzone – Competitive Hub für Super Smash Bros. Ultimate" />
    <meta
      name="twitter:description"
      content="86 Fighter-Profile mit 694 Combo-Routen, jede mit Quelle. Dazu die UltRank-Tier-Liste 2026 und Input-Notation."
    />
    <meta name="twitter:image" content="./og.jpg" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui; color: #eceef2">
        Blastzone braucht JavaScript für Roster, Filter und den Combo-Player.
      </p>
    </noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
